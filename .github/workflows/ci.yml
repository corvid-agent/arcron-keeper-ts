name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: fetch JS client
        run: bun scripts/fetch-arcron-js.ts
      - name: install
        run: bun install
      - name: unit tests
        run: bun test
      - name: dry-run against TestNet
        run: bun src/cli.ts --dry-run
